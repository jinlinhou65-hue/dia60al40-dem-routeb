name: zhang-pscale2-c-pressure-lift-recheck
on:
  workflow_dispatch:
    inputs:
      seed_json:
        description: 'JSON list of DEM seeds for the C pressure-lift recheck'
        required: false
        default: '["0","1","2","3","4"]'
  push:
    paths:
      - 'scripts/dispatch_zhang_pscale2_c_pressure_lift_recheck.py'
      - 'scripts/dispatch_zhang_size_specific_sweeps.py'
      - 'docs/reproduction_goal/03_zhang_particle_scale/data/pscale2_c_seed_recheck_summary.json'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-c-pressure-lift-recheck:
    name: dispatch Zhang pscale=2 C pressure-lift recheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build one-variable C pressure-lift plan
        env:
          SEED_JSON: ${{ github.event.inputs.seed_json || '["0","1","2","3","4"]' }}
        run: |
          set -euxo pipefail
          python3 scripts/dispatch_zhang_pscale2_c_pressure_lift_recheck.py \
            --ref "${GITHUB_REF_NAME}" \
            --seed-json "${SEED_JSON}" \
            --target-pressure-mpa 600 \
            --max-lift-ratio 1.30 \
            --max-total-runs 5 \
            > /tmp/zhang_pscale2_c_pressure_lift_recheck_plan.json
          cat /tmp/zhang_pscale2_c_pressure_lift_recheck_plan.json

      - name: Validate one-variable C pressure-lift plan
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json

          plan = json.load(open(
              "/tmp/zhang_pscale2_c_pressure_lift_recheck_plan.json",
              encoding="utf-8",
          ))
          if plan["mode"] != "zhang_pscale2_c_pressure_lift_recheck":
              raise SystemExit(f"unexpected mode: {plan['mode']}")
          if plan["payload_count"] != 1 or plan["total_estimated_run_count"] != 5:
              raise SystemExit("pressure-lift plan must contain one payload and five DEM jobs")

          item = plan["payloads"][0]
          inputs = item["inputs"]
          metadata = item["metadata"]
          if metadata["purpose"] != "c_pressure_lift_seed_recheck":
              raise SystemExit(f"unexpected purpose: {metadata['purpose']}")
          if metadata["changed_variable"] != "e_al_emax_gpa":
              raise SystemExit("the only changed physics variable must be Emax")
          if metadata["source_decision"] != "c_candidate_not_seed_robust":
              raise SystemExit("source decision does not justify a pressure-lift recheck")
          if metadata["target_e_al_emax_gpa"] != 72.581:
              raise SystemExit(f"unexpected derived Emax: {metadata['target_e_al_emax_gpa']}")
          if inputs["runtime_profile"] != "demo":
              raise SystemExit("pressure-lift recheck must remain runtime_profile=demo")
          if inputs["allow_evidence_mismatch"] != "true":
              raise SystemExit("pressure-lift recheck must preserve complete review evidence")
          if json.loads(inputs["diamond_size_case_json"]) != ["C"]:
              raise SystemExit("pressure-lift recheck must run only size C")
          if json.loads(inputs["particle_count_scale_json"]) != ["2"]:
              raise SystemExit("pressure-lift recheck must hold particle scale at 2")
          if json.loads(inputs["e_al_emax_sweep_json"]) != ["72.581"]:
              raise SystemExit("pressure-lift recheck must use only the derived Emax")
          if json.loads(inputs["mu_scale_json"]) != ["0.654"]:
              raise SystemExit("pressure-lift recheck must hold mu at 0.654")
          if json.loads(inputs["dem_seed_json"]) != ["0", "1", "2", "3", "4"]:
              raise SystemExit("pressure-lift recheck must preserve seeds 0..4")
          PY

      - name: Dispatch Zhang C pressure-lift DEM run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEED_JSON: ${{ github.event.inputs.seed_json || '["0","1","2","3","4"]' }}
        run: |
          set -euxo pipefail
          python3 scripts/dispatch_zhang_pscale2_c_pressure_lift_recheck.py \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}" \
            --seed-json "${SEED_JSON}" \
            --target-pressure-mpa 600 \
            --max-lift-ratio 1.30 \
            --max-total-runs 5 \
            --dispatch

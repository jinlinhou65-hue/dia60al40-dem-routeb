name: zhang-pscale2-c-wall-friction-recheck

on:
  workflow_dispatch:
    inputs:
      seed_json:
        description: 'JSON list of paired DEM seeds for the C sidewall-friction recheck'
        required: false
        default: '["0","1","2","3","4"]'
  push:
    paths:
      - '.github/workflows/zhang-pscale2-c-wall-friction-recheck.yml'
      - 'scripts/dispatch_zhang_pscale2_c_wall_friction_recheck.py'
      - 'docs/reproduction_goal/03_zhang_particle_scale/data/zhang_contact_parameter_audit.json'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-c-wall-friction:
    name: dispatch Zhang pscale=2 C paired sidewall-friction recheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build paired sidewall-friction plan
        env:
          SEED_JSON: ${{ github.event.inputs.seed_json || '["0","1","2","3","4"]' }}
        run: |
          set -euxo pipefail
          python3 scripts/dispatch_zhang_pscale2_c_wall_friction_recheck.py \
            --ref "${GITHUB_REF_NAME}" \
            --seed-json "${SEED_JSON}" \
            --max-total-runs 10 \
            > /tmp/zhang_pscale2_c_wall_friction_plan.json
          cat /tmp/zhang_pscale2_c_wall_friction_plan.json

      - name: Validate paired sidewall-friction plan
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json

          plan = json.load(open(
              "/tmp/zhang_pscale2_c_wall_friction_plan.json",
              encoding="utf-8",
          ))
          if plan["mode"] != "zhang_pscale2_c_wall_friction_recheck":
              raise SystemExit(f"unexpected mode: {plan['mode']}")
          if plan["payload_count"] != 1 or plan["total_estimated_run_count"] != 10:
              raise SystemExit("wall-friction plan must contain one payload and ten paired jobs")
          item = plan["payloads"][0]
          inputs = item["inputs"]
          metadata = item["metadata"]
          if metadata["changed_variable"] != "mu_wall_scale":
              raise SystemExit("the only changed variable must be mu_wall_scale")
          if inputs["runtime_profile"] != "demo":
              raise SystemExit("wall-friction recheck must use demo profile")
          if inputs["demo_settle_scale"] != "1" or inputs["demo_top_velocity_cm_s"] != "50":
              raise SystemExit("wall-friction recheck must restore settle1 and 50 cm/s")
          if json.loads(inputs["mu_wall_scale_json"]) != ["1", "0.019113"]:
              raise SystemExit("wall-friction recheck must pair baseline and mu_w=0.001")
          if json.loads(inputs["e_al_emax_sweep_json"]) != ["72.581"]:
              raise SystemExit("wall-friction recheck must hold Emax at 72.581 GPa")
          if json.loads(inputs["mu_scale_json"]) != ["0.654"]:
              raise SystemExit("wall-friction recheck must hold global mu at 0.654")
          if json.loads(inputs["diamond_size_case_json"]) != ["C"]:
              raise SystemExit("wall-friction recheck must run only size C")
          if json.loads(inputs["particle_count_scale_json"]) != ["2"]:
              raise SystemExit("wall-friction recheck must hold particle scale at 2")
          if json.loads(inputs["dem_seed_json"]) != ["0", "1", "2", "3", "4"]:
              raise SystemExit("wall-friction recheck must preserve paired seeds 0..4")
          PY

      - name: Dispatch paired sidewall-friction DEM run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEED_JSON: ${{ github.event.inputs.seed_json || '["0","1","2","3","4"]' }}
        run: |
          set -euxo pipefail
          python3 scripts/dispatch_zhang_pscale2_c_wall_friction_recheck.py \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}" \
            --seed-json "${SEED_JSON}" \
            --max-total-runs 10 \
            --dispatch

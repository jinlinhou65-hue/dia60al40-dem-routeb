name: dia60al40-dem
on:
  workflow_dispatch:
    inputs:
      e_al_e0_gpa:
        description: 'Smoothstep Al modulus at loose packing, GPa'
        required: false
        default: '5'
      e_al_emax_gpa:
        description: 'Smoothstep Al modulus near rho_total=0.95, GPa'
        required: false
        default: '12'
      e_al_emax_sweep_json:
        description: 'Optional JSON list for Emax sweep, e.g. ["10","12","14","16"]; empty uses e_al_emax_gpa'
        required: false
        default: ''
      e_diamond_gpa:
        description: 'Diamond DEM modulus, GPa'
        required: false
        default: '300'
      e_tool_gpa:
        description: 'Top tool DEM modulus, GPa'
        required: false
        default: '600'
      e_wall_gpa:
        description: 'Wall/die DEM modulus, GPa'
        required: false
        default: '200'
      mu_al_al:
        description: 'Al-Al friction coefficient'
        required: false
        default: '0.30'
      mu_al_diamond:
        description: 'Al-Diamond friction coefficient'
        required: false
        default: '0.30'
      mu_al_tool:
        description: 'Al-Tool friction coefficient'
        required: false
        default: '0.08'
      mu_al_wall:
        description: 'Al-Wall friction coefficient'
        required: false
        default: '0.08'
      mu_diamond_diamond:
        description: 'Diamond-Diamond friction coefficient'
        required: false
        default: '0.10'
      mu_diamond_tool:
        description: 'Diamond-Tool friction coefficient'
        required: false
        default: '0.08'
      mu_diamond_wall:
        description: 'Diamond-Wall friction coefficient'
        required: false
        default: '0.08'
      mu_scale_json:
        description: 'JSON list for mu sweep, e.g. ["0.7","1.0","1.3"]'
        required: false
        default: '["1.0"]'
      dem_seed_json:
        description: 'JSON list of reproducible DEM random-mixing seed indices, e.g. ["0","1","2","3","4"]'
        required: false
        default: '["0","1","2"]'
      diamond_size_case_json:
        description: 'JSON list of diamond size cases: C=80/130um, D=100um, E=60um. Counts keep Diamond/Al area near 60/40.'
        required: false
        default: '["C","D","E"]'
      particle_count_scale_json:
        description: 'JSON list of DEM particle-count refinement scales. Scale >1 preserves 2D solid area by reducing DEM radii.'
        required: false
        default: '["1"]'
      runtime_profile:
        description: 'DEM runtime profile: full for calibrated runs, demo for fast feasibility reruns'
        required: false
        default: 'full'
      demo_settle_scale:
        description: 'Multiplier for demo initial/stage/final settle steps; ignored by full profile'
        required: false
        default: '1'
      allow_evidence_mismatch:
        description: 'Allow complete DEM artifacts with paper-trend mismatches so robustness sweeps can aggregate non-passing samples'
        required: false
        default: 'false'
  push:
    paths:
      - 'python/**'
      - 'liggghts/**'
      - '.github/workflows/dia60al40-dem.yml'
      - 'scripts/**'

concurrency:
  group: dia60al40-dem-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  dem:
    name: dem size=${{ matrix.diamond_size_case }} pscale=${{ matrix.particle_count_scale }} Emax=${{ matrix.e_al_emax }}GPa mu_scale=${{ matrix.mu_scale }} seed=${{ matrix.dem_seed }} settle=${{ inputs.demo_settle_scale || '1' }}
    strategy:
      fail-fast: false
      matrix:
        mu_scale: ${{ fromJSON(inputs.mu_scale_json || '["1.0"]') }}
        e_al_emax: ${{ fromJSON(inputs.e_al_emax_sweep_json || format('["{0}"]', inputs.e_al_emax_gpa || '12')) }}
        # Push runs are a fast real-data demo: one representative case.
        # Manual workflow_dispatch keeps the broader default 3x3 ensemble above.
        dem_seed: ${{ fromJSON(inputs.dem_seed_json || '["0"]') }}
        diamond_size_case: ${{ fromJSON(inputs.diamond_size_case_json || '["C"]') }}
        particle_count_scale: ${{ fromJSON(inputs.particle_count_scale_json || '["1"]') }}
    # Ubuntu apt repos do NOT ship a working `liggghts` package, so we
    # build LIGGGHTS-PUBLIC from source. Use 22.04 because its older
    # g++ 11 tolerates the LIGGGHTS-PUBLIC codebase without -Werror noise.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner toolchain
        run: |
          set -euxo pipefail
          command -v git
          command -v make
          command -v g++
          g++ --version | head -1
          command -v python3
          python3 --version
          python3 -m pip --version || echo "[WARN] python3 pip unavailable; plots may be skipped"

      - name: Build LIGGGHTS-PUBLIC serial binary
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/CFDEMproject/LIGGGHTS-PUBLIC.git /tmp/lpub
          cd /tmp/lpub/src
          # Serial CI demo avoids OpenMPI apt dependencies; one process is enough
          # for the reduced feasibility run and keeps GitHub reruns stable.
          ( cd STUBS && make 2>&1 | tail -10 )
          make -j"$(nproc)" serial 2>&1 | tee /tmp/build_serial.log
          test -x lmp_serial
          sudo install -m 0755 lmp_serial /usr/local/bin/liggghts
          which liggghts
          ls -la /usr/local/bin/liggghts
          # Sanity-check: must respond and identify itself as LIGGGHTS.
          # NOTE: do NOT pipe `liggghts -h` directly into `head` — with `set -o pipefail`,
          # `head` closes stdin after 40 lines and liggghts dies with SIGPIPE (exit 141),
          # which would fail the whole step even though the binary is perfectly fine.
          # Spill to a file first, then preview + assert.
          liggghts -h >/tmp/liggghts_help.txt 2>&1 || true
          head -40 /tmp/liggghts_help.txt
          grep -q "LIGGGHTS" /tmp/liggghts_help.txt

      - name: Install plotting dependency
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          if python3 -c 'import matplotlib; print(matplotlib.__version__)'; then
            echo "DEM_PLOTS_AVAILABLE=1" >> "$GITHUB_ENV"
          elif python3 -m pip install --user --only-binary=:all: matplotlib \
            && python3 -c 'import matplotlib; print(matplotlib.__version__)'; then
            echo "DEM_PLOTS_AVAILABLE=1" >> "$GITHUB_ENV"
          else
            echo "[WARN] matplotlib unavailable; DEM data validation will continue without plots"
            echo "DEM_PLOTS_AVAILABLE=0" >> "$GITHUB_ENV"
          fi

      - name: Prepare meshes
        run: |
          set -euxo pipefail
          python3 - <<'PY' > /tmp/dem_case_height.env
          from python.render_dem_deck import DIAMOND_CASES, initial_die_height_um
          case = DIAMOND_CASES["${{ matrix.diamond_size_case }}"]
          print(f"HEIGHT_UM={initial_die_height_um(case):.9g}")
          PY
          cat /tmp/dem_case_height.env
          source /tmp/dem_case_height.env
          python3 python/prepare_meshes.py --height-um "$HEIGHT_UM"
          find liggghts/meshes -maxdepth 1 -type f -ls
          # Hard-assert all three STLs were produced and are non-empty.
          # Catches silent regressions in prepare_meshes.py before LIGGGHTS gets a chance to die on a missing file.
          for f in DieBox.stl DieLeft.stl DieRight.stl DieBottom.stl DieFrontBack.stl TopPlate.stl InsertFace.stl; do
            test -s "liggghts/meshes/$f" || { echo "[FATAL] missing/empty mesh: liggghts/meshes/$f"; exit 1; }
          done

      - name: Render DEM parameter deck
        run: |
          set -euxo pipefail
          RUNTIME_PROFILE="${{ inputs.runtime_profile || 'demo' }}"
          runtime_args=()
          if [ "$RUNTIME_PROFILE" = "demo" ]; then
            export DEMO_SETTLE_SCALE="${{ inputs.demo_settle_scale || '1' }}"
            python3 - <<'PY' > /tmp/dem_runtime_controls.env
            import math
            import os

            scale = float(os.environ["DEMO_SETTLE_SCALE"])
            if not math.isfinite(scale) or not 0.25 <= scale <= 10.0:
                raise SystemExit("demo_settle_scale must be finite and in [0.25, 10]")

            def scaled(base):
                return max(1, round(base * scale))

            print(f"INITIAL_SETTLE_STEPS={scaled(20000)}")
            print(f"STAGE_SETTLE_STEPS={scaled(20000)}")
            print(f"FINAL_SETTLE_STEPS={scaled(50000)}")
            PY
            cat /tmp/dem_runtime_controls.env
            source /tmp/dem_runtime_controls.env
            runtime_args+=(--top-vel-cm-s 50)
            runtime_args+=(--initial-settle-steps "$INITIAL_SETTLE_STEPS")
            runtime_args+=(--stage-settle-steps "$STAGE_SETTLE_STEPS")
            runtime_args+=(--final-settle-steps "$FINAL_SETTLE_STEPS")
          elif [ "$RUNTIME_PROFILE" != "full" ]; then
            echo "[FATAL] unsupported runtime_profile=$RUNTIME_PROFILE; use full or demo"
            exit 1
          fi
          python3 python/render_dem_deck.py \
            --input liggghts/in.dia60al40_dem_staged.liggghts \
            --output liggghts/in.dia60al40_dem_staged.rendered.liggghts \
            --diamond-size-case "${{ matrix.diamond_size_case }}" \
            --e-al-e0-gpa "${{ inputs.e_al_e0_gpa || '5' }}" \
            --e-al-emax-gpa "${{ matrix.e_al_emax }}" \
            --e-diamond-gpa "${{ inputs.e_diamond_gpa || '300' }}" \
            --e-tool-gpa "${{ inputs.e_tool_gpa || '600' }}" \
            --e-wall-gpa "${{ inputs.e_wall_gpa || '200' }}" \
            --mu-al-al "${{ inputs.mu_al_al || '0.30' }}" \
            --mu-al-diamond "${{ inputs.mu_al_diamond || '0.30' }}" \
            --mu-al-tool "${{ inputs.mu_al_tool || '0.08' }}" \
            --mu-al-wall "${{ inputs.mu_al_wall || '0.08' }}" \
            --mu-diamond-diamond "${{ inputs.mu_diamond_diamond || '0.10' }}" \
            --mu-diamond-tool "${{ inputs.mu_diamond_tool || '0.08' }}" \
            --mu-diamond-wall "${{ inputs.mu_diamond_wall || '0.08' }}" \
            --mu-scale "${{ matrix.mu_scale }}" \
            --seed-index "${{ matrix.dem_seed }}" \
            --particle-count-scale "${{ matrix.particle_count_scale }}" \
            "${runtime_args[@]}"
          sed -n '1,180p' liggghts/in.dia60al40_dem_staged.rendered.liggghts

      - name: Run staged DEM compaction
        working-directory: liggghts
        run: |
          set -euxo pipefail
          mkdir -p DEM
          dem_failure_diagnostics() {
            status=$?
            failed_command="${1:-unknown}"
            failed_line="${2:-unknown}"
            {
              echo "[DEM FAILURE] exit_status=$status"
              echo "[DEM FAILURE] failed_line=$failed_line"
              echo "[DEM FAILURE] failed_command=$failed_command"
              echo "[DEM FAILURE] utc_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "[DEM FAILURE] case=${{ matrix.diamond_size_case }} pscale=${{ matrix.particle_count_scale }} Emax=${{ matrix.e_al_emax }} mu_scale=${{ matrix.mu_scale }} seed=${{ matrix.dem_seed }}"
              if [ -f dia60al40_liggghts_staged.run.log ]; then
                echo "[DEM FAILURE] first matching LIGGGHTS/error lines"
                grep -nEi '(^ERROR|ERROR:|Lost atoms|non-numeric|nan|too many|out of range|failed|fatal)' \
                  dia60al40_liggghts_staged.run.log || true
                echo "[DEM FAILURE] log tail"
                tail -160 dia60al40_liggghts_staged.run.log || true
              else
                echo "[DEM FAILURE] dia60al40_liggghts_staged.run.log was not created"
              fi
              if [ -f DEM/model_parameters.csv ]; then
                echo "[DEM FAILURE] model parameters"
                cat DEM/model_parameters.csv
              fi
              if [ -d DEM ]; then
                echo "[DEM FAILURE] partial DEM output tree"
                find DEM -maxdepth 2 -type f -ls | sort -k11 || true
              fi
            } | tee DEM/failure_diagnostics.txt
            summary=""
            if [ -f dia60al40_liggghts_staged.run.log ]; then
              summary="$(grep -m1 -Ei '(^ERROR|ERROR:|Lost atoms|non-numeric|nan|too many|out of range|failed|fatal)' \
                dia60al40_liggghts_staged.run.log || true)"
            fi
            if [ -z "$summary" ]; then
              if [ -f DEM/final_dump_verify.log ]; then
                summary="$(grep -E '^\[VERIFY\] particles=|^\[FAIL\]' DEM/final_dump_verify.log \
                  | tr '\n' ' ' | sed 's/[[:space:]][[:space:]]*/ /g' | cut -c1-600 || true)"
              fi
            fi
            if [ -z "$summary" ]; then
              summary="exit $status at line $failed_line while running: $failed_command"
            fi
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=DEM compaction failure::$summary"
            exit "$status"
          }
          trap 'dem_failure_diagnostics "$BASH_COMMAND" "$LINENO"' ERR
          echo '[PWD]' "$PWD"
          echo '[INPUT HEAD]'
          sed -n '1,180p' in.dia60al40_dem_staged.rendered.liggghts
          echo '[RUN LIGGGHTS]'
          # `-in file` is the canonical invocation; stdin redirect can swallow output on some builds.
          # `tee` reads until EOF — it does NOT close stdin early, so pipefail+SIGPIPE is not a concern here
          # (unlike the `liggghts -h | head -40` trap in the previous step). If liggghts exits non-zero,
          # pipefail correctly propagates the failure.
          liggghts -in in.dia60al40_dem_staged.rendered.liggghts 2>&1 | tee dia60al40_liggghts_staged.run.log
          echo '[OUTPUT TREE]'
          find . -maxdepth 3 -type f -ls | sort -k11
          test -s dia60al40_liggghts_staged.run.log

          # Gate 1: surface any LIGGGHTS-level ERROR explicitly.
          # pipefail above usually catches these, but printing the matching line(s) up-front
          # makes diagnosis instant instead of scrolling through thousands of thermo lines.
          if grep -E '^ERROR' dia60al40_liggghts_staged.run.log; then
            echo "[FATAL] LIGGGHTS reported an ERROR (see grep output above)."
            exit 1
          fi

          # Soft-warn (do not fail): "Lost atoms" means particles silently left the box.
          # The deck pins z via `setforce NULL NULL 0.0` so this should never happen,
          # but if it does we want it visible without burying the run.
          if grep -E 'Lost atoms|WARNING.*lost' dia60al40_liggghts_staged.run.log; then
            echo "[WARN] LIGGGHTS reported lost atoms — check physics, but not failing the step."
          fi

          # Gate 2: each staged handoff dump must exist.
          ls DEM/stage0_preload_*.dump
          ls DEM/stage1_rho065_*.dump
          ls DEM/stage2_rho072_*.dump
          ls DEM/stage3_rho080_*.dump
          ls DEM/stage4_rho088_*.dump
          ls DEM/stage5_rho095_*.dump
          ls DEM/stage0_preload_contacts_*.local
          ls DEM/stage1_rho065_contacts_*.local
          ls DEM/stage2_rho072_contacts_*.local
          ls DEM/stage3_rho080_contacts_*.local
          ls DEM/stage4_rho088_contacts_*.local
          ls DEM/stage5_rho095_contacts_*.local

          # Gate 3: the FINAL dump must contain the exact target composition.
          # `insert/pack particles_in_region` is easy to misuse because the value is a
          # total target count, not the number inserted by that specific fix. The previous
          # loose >=30 gate allowed a green run with 26 Al + 8 DS + 0 DL. This gate forbids
          # that second-order false success. Projected 2D overlap is diagnostic-only here:
          # compressed Hertz DEM stages normally contain overlap, and the COMSOL geometry
          # converter removes it with a documented radius shrink.
          LAST_DUMP=$(ls -1 DEM/stage5_rho095_*.dump | sort -V | tail -1)
          echo "[VERIFY] last dump: $LAST_DUMP"
          EXPECT_AL=$(awk -F, '$1=="Al_count"{print int($2)}' DEM/model_parameters.csv)
          EXPECT_DS=$(awk -F, '$1=="diamond_count_DS"{print int($2)}' DEM/model_parameters.csv)
          EXPECT_DL=$(awk -F, '$1=="diamond_count_DL"{print int($2)}' DEM/model_parameters.csv)
          EXPECT_DS_RADIUS=$(awk -F, '$1=="diamond_dem_radius_DS_um"{print $2+0}' DEM/model_parameters.csv)
          EXPECT_DL_RADIUS=$(awk -F, '$1=="diamond_dem_radius_DL_um"{print $2+0}' DEM/model_parameters.csv)
          echo "[VERIFY] expected composition from model_parameters.csv: Al=$EXPECT_AL DS=$EXPECT_DS DL=$EXPECT_DL DS_radius_um=$EXPECT_DS_RADIUS DL_radius_um=$EXPECT_DL_RADIUS"
          python3 ../python/verify_liggghts_dump.py --input "$LAST_DUMP" \
            --expect-al "$EXPECT_AL" --expect-ds "$EXPECT_DS" --expect-dl "$EXPECT_DL" \
            --ds-radius-um "$EXPECT_DS_RADIUS" --dl-radius-um "$EXPECT_DL_RADIUS" \
            2>&1 | tee DEM/final_dump_verify.log

          # Gate 4: verify every stage against expected density windows and 2D
          # COMSOL handoff constraints. Overlap is reported, not failed, because it
          # is contact deformation in DEM. z drift and composition still fail.
          cd ..
          python3 python/verify_dem_stages.py --root liggghts/DEM \
            --expect-al "$EXPECT_AL" --expect-ds "$EXPECT_DS" --expect-dl "$EXPECT_DL" \
            --ds-radius-um "$EXPECT_DS_RADIUS" --dl-radius-um "$EXPECT_DL_RADIUS"
          test -s liggghts/DEM/pressure_density_curve_raw.csv

          # Export every stage into a raw DEM-FEM handoff table. We no longer
          # create COMSOL geometry CSVs here: high-density DEM stages contain
          # physical Hertz overlap, and forcing them into non-overlapping COMSOL
          # particles is a secondary visualization step, not the main pressure-
          # density result.
          for stage in stage0_preload stage1_rho065 stage2_rho072 stage3_rho080 stage4_rho088 stage5_rho095; do
            dump=$(ls -1 "liggghts/DEM/${stage}_"*.dump | sort -V | tail -1)
            python3 python/export_dem_stage_handoff.py \
              --input "$dump" \
              --stage-id "$stage" \
              --output "liggghts/DEM/dem_fem_handoff_${stage}.csv"
          done

          mkdir -p liggghts/DEM/contact_forces
          for stage in stage0_preload stage1_rho065 stage2_rho072 stage3_rho080 stage4_rho088 stage5_rho095; do
            contacts=$(ls -1 "liggghts/DEM/${stage}_contacts_"*.local | sort -V | tail -1)
            python3 python/export_liggghts_contact_forces.py \
              --local-dump "$contacts" \
              --particles "liggghts/DEM/dem_fem_handoff_${stage}.csv" \
              --stage-id "$stage" \
              --output "liggghts/DEM/contact_forces/${stage}_contacts.csv"
          done

          # Main project result: 2D DEM pressure-density curve. This is the
          # primary output for estimating the punch pressure required to reach
          # rho_total ~= 0.95.
          python3 python/export_pressure_density_curve.py \
            --root liggghts/DEM \
            --raw liggghts/DEM/pressure_density_curve_raw.csv \
            --output liggghts/DEM/pressure_density_curve.csv
          echo '[PRESSURE-DENSITY CURVE]'
          cat liggghts/DEM/pressure_density_curve.csv
          python3 python/analyze_pressure_density.py \
            --curve liggghts/DEM/pressure_density_curve.csv \
            --output liggghts/DEM/pressure_density_summary.csv \
            --target-rho 0.95 \
            --target-pressure-mpa 200
          cat liggghts/DEM/pressure_density_summary.csv
          mkdir -p liggghts/DEM/plots
          if [ "${DEM_PLOTS_AVAILABLE:-0}" = "1" ]; then
            python3 python/plot_dem_results.py \
              --root liggghts/DEM \
              --curve liggghts/DEM/pressure_density_curve.csv \
              --outdir liggghts/DEM/plots
            python3 python/plot_plastic_morphology.py \
              --root liggghts/DEM \
              --outdir liggghts/DEM/plots \
              --metrics liggghts/DEM/plastic_morphology_metrics.csv
            python3 python/verify_plastic_morphology.py \
              --metrics liggghts/DEM/plastic_morphology_metrics.csv
          else
            echo "[WARN] skipped plot generation because matplotlib is unavailable" \
              > liggghts/DEM/plots/plots_skipped.txt
          fi

          # Paper-reproduction post-processing: connect the real DEM stage
          # handoff tables to the Zhang/Yuan/Liu/Li metric and acceptance
          # scaffold. These outputs are uploaded with the normal DEM artifact
          # bundle under liggghts/DEM/paper_reproduction.
          python3 scripts/process_stage_series.py \
            --snapshot-dir liggghts/DEM \
            --pressure-curve liggghts/DEM/pressure_density_curve.csv \
            --outdir liggghts/DEM/paper_reproduction \
            --contact-dir liggghts/DEM/contact_forces \
            --width-um 400
          echo '[PAPER REPRODUCTION ACCEPTANCE]'
          cat liggghts/DEM/paper_reproduction/series_acceptance_summary.csv
          echo '[PAPER REPRODUCTION REPORT HEAD]'
          sed -n '1,120p' liggghts/DEM/paper_reproduction/series_report.md

          # Zhang force-chain calibration sweep: scan strong-contact thresholds
          # and minimum chain lengths on the direct LIGGGHTS pair-force series.
          # A passing candidate is useful, but a review-only result is also
          # valuable evidence that Zhang needs contact-law/scale calibration
          # rather than only post-processing threshold tuning.
          python3 scripts/calibrate_zhang_force_chain.py \
            --snapshot-dir liggghts/DEM \
            --pressure-curve liggghts/DEM/pressure_density_curve.csv \
            --contact-dir liggghts/DEM/contact_forces \
            --outdir liggghts/DEM/paper_reproduction/zhang_force_chain_calibration \
            --threshold-factors 0.05,0.1,0.25,0.5,0.75,1.0,1.25,1.5,2.0 \
            --min-chain-lengths 2,3,4
          echo '[ZHANG FORCE-CHAIN CALIBRATION SUMMARY]'
          cat liggghts/DEM/paper_reproduction/zhang_force_chain_calibration/zhang_force_chain_calibration_summary.csv
          echo '[ZHANG FORCE-CHAIN CALIBRATION REPORT HEAD]'
          sed -n '1,100p' liggghts/DEM/paper_reproduction/zhang_force_chain_calibration/zhang_force_chain_calibration_report.md

          # Evidence gate: prove this run contains a complete real DEM stage
          # series plus paper-reproduction metrics, not only generated stubs.
          validate_args=()
          if [ "${{ inputs.allow_evidence_mismatch || 'false' }}" = "true" ]; then
            validate_args+=(--allow-mismatch)
          fi
          python3 scripts/validate_dem_evidence.py \
            --dem-dir liggghts/DEM \
            --outdir liggghts/DEM/paper_reproduction \
            "${validate_args[@]}"
          echo '[DEM EVIDENCE VALIDATION]'
          cat liggghts/DEM/paper_reproduction/dem_evidence_summary.csv
          echo '[DEM EVIDENCE REPORT HEAD]'
          sed -n '1,140p' liggghts/DEM/paper_reproduction/dem_evidence_report.md

          find liggghts/DEM/plots -maxdepth 1 -type f -ls | sort -k11

      - name: Upload DEM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dia60al40-dem-artifacts-size${{ matrix.diamond_size_case }}-pscale${{ matrix.particle_count_scale }}-Emax${{ matrix.e_al_emax }}-mu${{ matrix.mu_scale }}-seed${{ matrix.dem_seed }}-settle${{ inputs.demo_settle_scale || '1' }}
          path: |
            liggghts/DEM/**
            liggghts/*.log
            liggghts/*.liggghts
            liggghts/meshes/*.stl

  ensemble:
    name: aggregate DEM seed ensemble
    needs: dem
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install plotting dependency
        run: |
          set -euxo pipefail
          python3 --version
          python3 -c 'import matplotlib; print(matplotlib.__version__)' \
            || python3 -m pip install --user --only-binary=:all: matplotlib \
            || echo "[WARN] matplotlib unavailable; ensemble CSV aggregation will continue without plots"

      - name: Download DEM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dia60al40-dem-artifacts-*
          path: ensemble_inputs
          merge-multiple: false

      - name: Aggregate seed ensemble
        run: |
          set -euxo pipefail
          find ensemble_inputs -maxdepth 3 -type f | sort > /tmp/ensemble_files.txt
          head -80 /tmp/ensemble_files.txt
          python3 python/aggregate_ensemble_results.py \
            --root ensemble_inputs \
            --outdir ensemble_summary
          python3 scripts/aggregate_zhang_calibration.py \
            --root ensemble_inputs \
            --outdir ensemble_summary
          cat ensemble_summary/ensemble_runs.csv
          cat ensemble_summary/ensemble_pressure_summary.csv
          cat ensemble_summary/ensemble_pressure_summary_by_size_case.csv
          cat ensemble_summary/zhang_calibration_best_by_run.csv
          cat ensemble_summary/zhang_calibration_group_summary.csv
          cat ensemble_summary/zhang_next_sweep_recommendation.json
          sed -n '1,120p' ensemble_summary/zhang_next_sweep_recommendation.md
          sed -n '1,120p' ensemble_summary/zhang_calibration_ensemble_report.md

          mkdir -p ensemble_seed_plots
          for artifact_dir in ensemble_inputs/dia60al40-dem-artifacts-*; do
            test -d "$artifact_dir/DEM" || continue
            case_name="$(awk -F, '$1=="diamond_size_case"{print $2}' "$artifact_dir/DEM/model_parameters.csv")"
            pscale_name="$(awk -F, '$1=="particle_count_scale"{print "pscale" int($2)}' "$artifact_dir/DEM/model_parameters.csv")"
            seed_name="$(awk -F, '$1=="DEM_seed_index"{print "seed" int($2)}' "$artifact_dir/DEM/model_parameters.csv")"
            run_name="size${case_name}_${pscale_name}_${seed_name}"
            mkdir -p "ensemble_seed_plots/$run_name"
            cp "$artifact_dir/DEM/pressure_density_curve.csv" "ensemble_seed_plots/$run_name/"
            cp "$artifact_dir/DEM/pressure_density_summary.csv" "ensemble_seed_plots/$run_name/"
            cp "$artifact_dir/DEM/model_parameters.csv" "ensemble_seed_plots/$run_name/"
            for f in \
              "$artifact_dir"/DEM/plots/particles_stage*.png \
              "$artifact_dir"/DEM/plots/plastic_morphology_stage*.png \
              "$artifact_dir"/DEM/plots/pressure_density_curve.png \
              "$artifact_dir"/DEM/plots/boundary_pressure_curve.png
            do
              [ -e "$f" ] || continue
              cp "$f" "ensemble_seed_plots/$run_name/"
            done
          done
          find ensemble_seed_plots -maxdepth 2 -type f | sort

      - name: Upload ensemble summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dia60al40-dem-ensemble-summary
          path: ensemble_summary/**

      - name: Upload seed plot bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dia60al40-dem-seed-plots
          path: ensemble_seed_plots/**

name: zhang-pscale2-recalibration
on:
  workflow_dispatch:
    inputs:
      target_pressure_mpa:
        description: 'Target Zhang endpoint pressure for the pscale=2 recalibration'
        required: false
        default: '600'
      e_multipliers_json:
        description: 'JSON multipliers around computed target Emax, e.g. [0.95,1.0,1.05]'
        required: false
        default: '[0.95,1.0,1.05]'
  push:
    paths:
      - '.github/workflows/zhang-pscale2-recalibration.yml'
      - '.github/workflows/dia60al40-dem.yml'
      - 'scripts/dispatch_zhang_pscale2_recalibration.py'
      - 'scripts/dispatch_zhang_size_specific_sweeps.py'
      - 'docs/reproduction_goal/03_zhang_particle_scale/data/1x_vs_2x_comparison.csv'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-pscale2-recalibration:
    name: dispatch Zhang pscale=2 pressure recalibration
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Zhang pscale=2 recalibration plan
        env:
          TARGET_PRESSURE_MPA: ${{ github.event.inputs.target_pressure_mpa || '600' }}
          E_MULTIPLIERS_JSON: ${{ github.event.inputs.e_multipliers_json || '[0.95,1.0,1.05]' }}
        run: |
          set -euxo pipefail
          python3 scripts/dispatch_zhang_pscale2_recalibration.py \
            --ref "${GITHUB_REF_NAME}" \
            --target-pressure-mpa "${TARGET_PRESSURE_MPA}" \
            --e-multipliers-json "${E_MULTIPLIERS_JSON}" \
            --max-total-runs 9 \
            > /tmp/zhang_pscale2_recalibration_plan.json
          cat /tmp/zhang_pscale2_recalibration_plan.json

      - name: Validate Zhang pscale=2 recalibration plan
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          plan = json.load(open("/tmp/zhang_pscale2_recalibration_plan.json", encoding="utf-8"))
          if plan["payload_count"] != 3:
              raise SystemExit(f"expected 3 pscale=2 payloads, got {plan['payload_count']}")
          if plan["total_estimated_run_count"] != 9:
              raise SystemExit(f"expected 9 DEM jobs, got {plan['total_estimated_run_count']}")
          sizes = [item["metadata"]["diamond_size_case"] for item in plan["payloads"]]
          if sizes != ["C", "D", "E"]:
              raise SystemExit(f"expected C/D/E payloads, got {sizes}")
          for item in plan["payloads"]:
              inputs = item["inputs"]
              if inputs["runtime_profile"] != "demo":
                  raise SystemExit("pscale=2 recalibration must remain runtime_profile=demo")
              if inputs["allow_evidence_mismatch"] != "true":
                  raise SystemExit("pscale=2 recalibration must collect complete review evidence")
              if json.loads(inputs["particle_count_scale_json"]) != ["2"]:
                  raise SystemExit("pscale=2 recalibration must keep particle_count_scale_json=[\"2\"]")
              if len(json.loads(inputs["e_al_emax_sweep_json"])) != 3:
                  raise SystemExit("each size must sweep exactly 3 endpoint modulus values")
          PY

      - name: Dispatch Zhang pscale=2 recalibration DEM runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_PRESSURE_MPA: ${{ github.event.inputs.target_pressure_mpa || '600' }}
          E_MULTIPLIERS_JSON: ${{ github.event.inputs.e_multipliers_json || '[0.95,1.0,1.05]' }}
        run: |
          set -euxo pipefail
          python3 scripts/dispatch_zhang_pscale2_recalibration.py \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}" \
            --target-pressure-mpa "${TARGET_PRESSURE_MPA}" \
            --e-multipliers-json "${E_MULTIPLIERS_JSON}" \
            --max-total-runs 9 \
            --dispatch

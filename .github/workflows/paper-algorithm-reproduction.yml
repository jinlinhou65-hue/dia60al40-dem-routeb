name: paper-algorithm-reproduction

on:
  workflow_dispatch:
    inputs:
      paper:
        description: 'Paper to reproduce: all, zhang, yuan, liu, or li'
        required: false
        default: 'all'
  push:
    paths:
      - 'python/paper_reproduction/**'
      - 'python/dem_case_config.py'
      - 'python/dem_case_geometry.py'
      - 'python/export_liggghts_contact_forces.py'
      - 'python/render_dem_deck.py'
      - 'scripts/run_paper_algorithm_reproduction.py'
      - 'scripts/calibrate_zhang_force_chain.py'
      - 'scripts/aggregate_zhang_calibration.py'
      - 'scripts/generate_paper_reproduction_manifest.py'
      - 'scripts/process_particle_snapshot.py'
      - 'scripts/process_stage_series.py'
      - 'tests/**'
      - 'docs/paper_algorithm_reproduction.md'
      - 'docs/paper_pdf_reproduction_map.md'
      - 'docs/dem_algorithm_selection.md'
      - 'docs/powder_compaction_simulation_method.md'
      - '.github/scripts/validate_paper_reproduction_content.py'
      - '.github/workflows/paper-algorithm-reproduction.yml'

jobs:
  paper-algorithms:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify Python modules
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            python/paper_reproduction/__init__.py \
            python/paper_reproduction/contact_metrics.py \
            python/paper_reproduction/core.py \
            python/paper_reproduction/dem_backend_selection.py \
            python/paper_reproduction/cases.py \
            python/paper_reproduction/dem_evidence.py \
            python/paper_reproduction/dem_evidence_checks.py \
            python/paper_reproduction/direct_force_validation.py \
            python/paper_reproduction/li_model.py \
            python/paper_reproduction/li_validation.py \
            python/paper_reproduction/network.py \
            python/paper_reproduction/pdf_evidence.py \
            python/paper_reproduction/registry.py \
            python/paper_reproduction/report.py \
            python/paper_reproduction/series.py \
            python/paper_reproduction/sintering.py \
            python/paper_reproduction/validation.py \
            python/paper_reproduction/zhang_calibration_ensemble.py \
            python/paper_reproduction/zhang_force_chain_calibration.py \
            python/paper_reproduction/zhang_validation.py \
            python/paper_reproduction/yuan_validation.py \
            python/dem_case_config.py \
            python/dem_case_geometry.py \
            python/export_liggghts_contact_forces.py \
            python/render_dem_deck.py \
            scripts/validate_dem_evidence.py \
            scripts/run_paper_algorithm_reproduction.py \
            scripts/calibrate_zhang_force_chain.py \
            scripts/aggregate_zhang_calibration.py \
            scripts/generate_paper_reproduction_manifest.py \
            scripts/generate_dem_backend_selection_doc.py \
            scripts/process_particle_snapshot.py \
            scripts/process_stage_series.py \
            .github/scripts/validate_paper_reproduction_content.py

      - name: Run unit tests
        run: |
          set -euxo pipefail
          mkdir -p outputs/ci_diagnostics
          set +e
          python3 -m unittest discover -s tests -p "test_*.py" \
            > >(tee outputs/ci_diagnostics/unit_tests.log) 2>&1
          test_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path

          log = Path("outputs/ci_diagnostics/unit_tests.log").read_text(
              encoding="utf-8", errors="replace"
          )
          tail = log[-50000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=tests,title=Python unit-test failure::{tail}")
          PY
            exit "$test_status"
          fi

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-algorithm-ci-diagnostics
          path: outputs/ci_diagnostics/**

      - name: Generate paper reproduction outputs
        run: |
          set -euxo pipefail
          python3 scripts/run_paper_algorithm_reproduction.py \
            --paper "${{ inputs.paper || 'all' }}" \
            --outdir outputs/paper_algorithm_reproduction
          find outputs/paper_algorithm_reproduction -type f | sort

      - name: Validate generated paper content
        run: |
          set -euxo pipefail
          python3 .github/scripts/validate_paper_reproduction_content.py \
            --paper "${{ inputs.paper || 'all' }}" \
            --outdir outputs/paper_algorithm_reproduction

      - name: Upload paper algorithm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-algorithm-reproduction-${{ inputs.paper || 'all' }}
          path: outputs/paper_algorithm_reproduction/**
